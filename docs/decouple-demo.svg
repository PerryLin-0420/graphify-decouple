<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="graphify decouple: MainWindow god node splitting into risk-scored candidate classes"><defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1712"/><stop offset="1" stop-color="#0f1e18"/></linearGradient><radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#62c4a2" stop-opacity="0.35"/><stop offset="1" stop-color="#62c4a2" stop-opacity="0"/></radialGradient><radialGradient id="glow-red" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f87171" stop-opacity="0.4"/><stop offset="1" stop-color="#f87171" stop-opacity="0"/></radialGradient></defs><rect x="1" y="1" width="898" height="378" rx="14" fill="url(#bg2)" stroke="#20342b" stroke-width="1.5"/><line x1="336" y1="18" x2="336" y2="362" stroke="#1c2c25" stroke-width="1"/><circle cx="28" cy="30" r="4.5" fill="#ff5f56"/><circle cx="46" cy="30" r="4.5" fill="#ffbd2e"/><circle cx="64" cy="30" r="4.5" fill="#27c93f"/><text x="320" y="34" text-anchor="end" font-size="10" fill="#6f8a7f">graphify decouple</text>

<!-- terminal column -->
<text x="20" y="74" font-size="11" fill="#4db18f" font-weight="600">$ graphify decouple --project-root .</text>
<rect x="20" y="82" width="300" height="1" fill="#1c2c25"/>

<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.18;0.96;1" dur="12s" repeatCount="indefinite"/>
  <text x="20" y="108" font-size="11" fill="#6f8a7f">analyzed 10 god nodes</text>
  <text x="20" y="130" font-size="11" fill="#c6d6ce">4 god-object candidates</text>
  <text x="20" y="152" font-size="11" fill="#c6d6ce">5 over-referenced hubs</text>
</g>

<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.26;0.32;0.96;1" dur="12s" repeatCount="indefinite"/>
  <text x="20" y="186" font-size="11" fill="#62c4a2" font-weight="600">MainWindow — god_object</text>
  <text x="20" y="208" font-size="11" fill="#c6d6ce">member_ratio=0.534, 47 methods</text>
  <text x="20" y="230" font-size="11" fill="#c6d6ce">risk_before=95.8</text>
</g>

<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.48;0.96;1" dur="12s" repeatCount="indefinite"/>
  <text x="20" y="256" font-size="11" fill="#f59e0b" font-weight="600">state check: 2 proposed groups</text>
  <text x="20" y="278" font-size="10.5" fill="#f87171">share _x_range, _y_range (writes)</text>
  <text x="20" y="298" font-size="10.5" fill="#f87171">share _replot() call</text>
</g>

<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.64;0.96;1" dur="12s" repeatCount="indefinite"/>
  <text x="20" y="326" font-size="12" fill="#c6d6ce">risk_after: 50.5 <tspan fill="#6f8a7f">(call graph only)</tspan></text>
  <text x="20" y="346" font-size="13" fill="#62c4a2" font-weight="600">-&gt; 87.0 once state is counted</text>
</g>

<!-- graph column: BEFORE state -->
<g id="before">
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.12;0.60;0.66;1" dur="12s" repeatCount="indefinite"/>
  <text x="618" y="46" text-anchor="middle" font-size="10.5" fill="#6f8a7f">graph.html — before</text>
  <circle cx="618" cy="195" r="26" fill="url(#glow2)"/>
  <line x1="618" y1="195" x2="500" y2="110" stroke="#3a4a42" stroke-width="1.2"/>
  <line x1="618" y1="195" x2="560" y2="90"  stroke="#3a4a42" stroke-width="1.2"/>
  <line x1="618" y1="195" x2="700" y2="95"  stroke="#3a4a42" stroke-width="1.2"/>
  <line x1="618" y1="195" x2="760" y2="150" stroke="#3a4a42" stroke-width="1.2"/>
  <line x1="618" y1="195" x2="740" y2="240" stroke="#3a4a42" stroke-width="1.2"/>
  <line x1="618" y1="195" x2="660" y2="290" stroke="#3a4a42" stroke-width="1.2"/>
  <line x1="618" y1="195" x2="540" y2="280" stroke="#3a4a42" stroke-width="1.2"/>
  <line x1="618" y1="195" x2="480" y2="220" stroke="#3a4a42" stroke-width="1.2"/>
  <circle cx="618" cy="195" r="14" fill="#0a1410" stroke="#4ade80" stroke-width="2"/>
  <text x="618" y="199" text-anchor="middle" font-size="9" fill="#c6d6ce" font-weight="600">MW</text>
  <g fill="#8fa89c">
    <circle cx="500" cy="110" r="5"/><circle cx="560" cy="90" r="5"/><circle cx="700" cy="95" r="5"/>
    <circle cx="760" cy="150" r="5"/><circle cx="740" cy="240" r="5"/><circle cx="660" cy="290" r="5"/>
    <circle cx="540" cy="280" r="5"/><circle cx="480" cy="220" r="5"/>
  </g>
  <text x="618" y="330" text-anchor="middle" font-size="10" fill="#6f8a7f">47 methods, 1 class</text>
</g>

<!-- graph column: AFTER state -->
<g id="after" opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.60;0.68;0.96;1" dur="12s" repeatCount="indefinite"/>
  <text x="618" y="46" text-anchor="middle" font-size="10.5" fill="#6f8a7f">DECOUPLE.html — after (preview)</text>
  <circle cx="618" cy="195" r="12" fill="#0a1410" stroke="#4ade80" stroke-width="2"/>
  <text x="618" y="198" text-anchor="middle" font-size="8.5" fill="#c6d6ce" font-weight="600">MW</text>
  <line x1="618" y1="195" x2="520" y2="130" stroke="#22c55e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="618" y1="195" x2="716" y2="130" stroke="#22c55e" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M520,130 Q618,90 716,130" fill="none" stroke="#f87171" stroke-width="1.8"/>
  <circle cx="618" cy="98" r="16" fill="url(#glow-red)"/>
  <text x="618" y="80" text-anchor="middle" font-size="9" fill="#f87171" font-style="italic">shared _x_range, _replot()</text>
  <g transform="translate(520,130)"><path d="M0,-13 L13,0 L0,13 L-13,0 Z" fill="#0a1410" stroke="#22c55e" stroke-width="2" stroke-dasharray="3 2"/></g>
  <text x="520" y="160" text-anchor="middle" font-size="9" fill="#c6d6ce">Axis &amp; Range</text>
  <g transform="translate(716,130)"><path d="M0,-13 L13,0 L0,13 L-13,0 Z" fill="#0a1410" stroke="#22c55e" stroke-width="2" stroke-dasharray="3 2"/></g>
  <text x="716" y="160" text-anchor="middle" font-size="9" fill="#c6d6ce">Controller Core</text>
  <text x="618" y="290" text-anchor="middle" font-size="10" fill="#c6d6ce">2 of 5 proposed classes shown</text>
  <text x="618" y="312" text-anchor="middle" font-size="12" fill="#62c4a2" font-weight="600">net_benefit 45.3 -&gt; 8.8</text>
  <text x="618" y="332" text-anchor="middle" font-size="9.5" fill="#6f8a7f">still worth it — but barely, and now honestly so</text>
</g>

</svg>
