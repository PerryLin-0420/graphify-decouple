<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="graphify decouple --3d: data-flow floors stacked on Z, a god class replaced by proposed groups landing on different floors"><defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1712"/><stop offset="1" stop-color="#0f1e18"/></linearGradient><radialGradient id="glow3" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#62c4a2" stop-opacity="0.35"/><stop offset="1" stop-color="#62c4a2" stop-opacity="0"/></radialGradient><radialGradient id="glow-red3" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f87171" stop-opacity="0.4"/><stop offset="1" stop-color="#f87171" stop-opacity="0"/></radialGradient></defs>
<rect x="1" y="1" width="898" height="458" rx="14" fill="url(#bg3)" stroke="#20342b" stroke-width="1.5"/>
<line x1="336" y1="18" x2="336" y2="442" stroke="#1c2c25" stroke-width="1"/>
<circle cx="28" cy="30" r="4.5" fill="#ff5f56"/><circle cx="46" cy="30" r="4.5" fill="#ffbd2e"/><circle cx="64" cy="30" r="4.5" fill="#27c93f"/>
<text x="320" y="34" text-anchor="end" font-size="10" fill="#6f8a7f">graphify decouple --3d</text>

<!-- terminal column -->
<text x="20" y="74" font-size="11" fill="#4db18f" font-weight="600">$ graphify decouple --3d --project-root .</text>
<rect x="20" y="82" width="300" height="1" fill="#1c2c25"/>

<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.18;0.96;1" dur="12s" repeatCount="indefinite"/>
  <text x="20" y="108" font-size="11" fill="#6f8a7f">DECOUPLE.html — WHAT belongs to what</text>
  <text x="20" y="130" font-size="11" fill="#c6d6ce">class/module regions, force-directed</text>
  <text x="20" y="152" font-size="11" fill="#c6d6ce">cannot show the other axis: depth</text>
</g>

<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.26;0.32;0.96;1" dur="12s" repeatCount="indefinite"/>
  <text x="20" y="186" font-size="11" fill="#62c4a2" font-weight="600">data_floor: longest path from I/O</text>
  <text x="20" y="208" font-size="11" fill="#c6d6ce">weighted hops — calls cost 1,</text>
  <text x="20" y="230" font-size="11" fill="#c6d6ce">method/intra-module cost 0</text>
</g>

<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.48;0.96;1" dur="12s" repeatCount="indefinite"/>
  <text x="20" y="256" font-size="11" fill="#f59e0b" font-weight="600">GroupAnalyzeDialog — floor 3</text>
  <text x="20" y="278" font-size="10.5" fill="#c6d6ce">every method: ONE shared floor</text>
  <text x="20" y="298" font-size="10.5" fill="#c6d6ce">(a function is contained by its class)</text>
</g>

<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.64;0.96;1" dur="12s" repeatCount="indefinite"/>
  <text x="20" y="326" font-size="11" fill="#f87171" font-weight="600">split proposed: 2 groups</text>
  <text x="20" y="348" font-size="12" fill="#c6d6ce">land on floor 2 and floor 4</text>
  <text x="20" y="370" font-size="10.5" fill="#6f8a7f">— a real data-flow stage apart</text>
</g>

<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.80;0.96;1" dur="12s" repeatCount="indefinite"/>
  <text x="20" y="398" font-size="12" fill="#62c4a2" font-weight="600">max_group_floor_risk: 50.0</text>
  <text x="20" y="420" font-size="10.5" fill="#6f8a7f">added into split_risk_score —</text>
  <text x="20" y="440" font-size="10.5" fill="#6f8a7f">a risk the call graph alone can't see</text>
</g>

<!-- floor stack, shared by before/after -->
<g font-size="9.5" fill="#5a7268">
  <text x="356" y="401" text-anchor="end">Floor 0</text>
  <text x="356" y="333" text-anchor="end">Floor 1</text>
  <text x="356" y="265" text-anchor="end">Floor 2</text>
  <text x="356" y="197" text-anchor="end">Floor 3</text>
  <text x="356" y="129" text-anchor="end">Floor 4</text>
</g>
<g stroke="#223229" stroke-width="1">
  <ellipse cx="640" cy="400" rx="220" ry="34"/>
  <ellipse cx="640" cy="332" rx="220" ry="34"/>
  <ellipse cx="640" cy="264" rx="220" ry="34"/>
  <ellipse cx="640" cy="196" rx="220" ry="34"/>
  <ellipse cx="640" cy="128" rx="220" ry="34"/>
</g>
<text x="640" y="418" text-anchor="middle" font-size="9" fill="#3f5750" font-style="italic">I/O boundary</text>

<!-- floor-plane "other regions" for context, static in both states -->
<g fill="#3a4a42">
  <circle cx="520" cy="400" r="7"/><circle cx="760" cy="400" r="7"/>
  <circle cx="540" cy="332" r="7"/><circle cx="740" cy="332" r="7"/>
  <circle cx="560" cy="264" r="7"/><circle cx="720" cy="264" r="7"/>
</g>

<!-- BEFORE: GroupAnalyzeDialog as ONE disc, uniformly floor 3 -->
<g id="before3d">
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.12;0.60;0.66;1" dur="12s" repeatCount="indefinite"/>
  <text x="640" y="46" text-anchor="middle" font-size="10.5" fill="#6f8a7f">before — one region, one floor</text>
  <line x1="640" y1="196" x2="560" y2="264" stroke="#3a4a42" stroke-width="1.2"/>
  <line x1="640" y1="196" x2="720" y2="264" stroke="#3a4a42" stroke-width="1.2"/>
  <line x1="640" y1="196" x2="540" y2="332" stroke="#3a4a42" stroke-width="1.2"/>
  <line x1="640" y1="196" x2="520" y2="400" stroke="#3a4a42" stroke-width="1.2"/>
  <circle cx="640" cy="196" r="24" fill="url(#glow3)"/>
  <circle cx="640" cy="196" r="14" fill="#0a1410" stroke="#4ade80" stroke-width="2"/>
  <text x="640" y="200" text-anchor="middle" font-size="8" fill="#c6d6ce" font-weight="600">GAD</text>
  <text x="640" y="240" text-anchor="middle" font-size="10" fill="#6f8a7f">34 methods, all floor 3</text>
</g>

<!-- AFTER: 2 proposed groups, landing on floor 2 and floor 4 -->
<g id="after3d" opacity="0">
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.60;0.68;0.96;1" dur="12s" repeatCount="indefinite"/>
  <text x="640" y="46" text-anchor="middle" font-size="10.5" fill="#6f8a7f">after — Preview decoupled view</text>
  <path d="M600,264 Q640,196 680,128" fill="none" stroke="#f87171" stroke-width="1.8"/>
  <circle cx="640" cy="196" r="18" fill="url(#glow-red3)"/>
  <text x="640" y="90" text-anchor="middle" font-size="9" fill="#f87171" font-style="italic">crosses 2 floors</text>
  <g transform="translate(600,264)"><path d="M0,-13 L13,0 L0,13 L-13,0 Z" fill="#0a1410" stroke="#22c55e" stroke-width="2" stroke-dasharray="3 2"/></g>
  <text x="600" y="294" text-anchor="middle" font-size="9" fill="#c6d6ce">Files &amp; Selection</text>
  <text x="600" y="308" text-anchor="middle" font-size="8.5" fill="#6f8a7f">floor 2</text>
  <g transform="translate(680,128)"><path d="M0,-13 L13,0 L0,13 L-13,0 Z" fill="#0a1410" stroke="#22c55e" stroke-width="2" stroke-dasharray="3 2"/></g>
  <text x="680" y="152" text-anchor="middle" font-size="9" fill="#c6d6ce">Correlation Chart</text>
  <text x="680" y="166" text-anchor="middle" font-size="8.5" fill="#6f8a7f">floor 4</text>
  <text x="640" y="424" text-anchor="middle" font-size="10" fill="#c6d6ce">2 of 34 methods shown</text>
  <text x="640" y="444" text-anchor="middle" font-size="11.5" fill="#f87171" font-weight="600">max_group_floor_risk 50.0</text>
</g>

</svg>
