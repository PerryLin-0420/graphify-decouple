<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" role="img" aria-label="DECOUPLE.html: MainWindow split into 5 candidate classes, Node Info panel open on Main Window Axis and Range Controls showing a 0.608 state overlap with Main Window Controller Core">
  <!-- Faithful static recreation of graphify decouple's actual DECOUPLE.html page (exporters/html.py),
       using the real page CSS colors (#0f0f1a body / #1a1a2e sidebar) and the REAL AutoCheck run's data
       (MainWindow's 5 proposed groups, real risk numbers, real shared-attribute names) — not a pixel
       screenshot (the in-session browser pane could not be captured), but every number and label here
       is copied verbatim from decouple.json. -->
  <defs>
    <radialGradient id="ss-glow-a" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4E79A7" stop-opacity="0.5"/><stop offset="1" stop-color="#4E79A7" stop-opacity="0"/></radialGradient>
    <radialGradient id="ss-glow-b" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F28E2B" stop-opacity="0.4"/><stop offset="1" stop-color="#F28E2B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="760" fill="#0f0f1a"/>

  <!-- ===== graph canvas ===== -->
  <g>
    <!-- faint background nodes: the rest of the 1243-node corpus graph -->
    <g stroke="#22243a" stroke-width="1" opacity="0.55">
      <line x1="120" y1="90" x2="230" y2="150"/><line x1="230" y1="150" x2="180" y2="260"/>
      <line x1="1000" y1="80" x2="900" y2="160"/><line x1="900" y1="160" x2="960" y2="260"/>
      <line x1="120" y1="640" x2="220" y2="600"/><line x1="960" y1="650" x2="880" y2="600"/>
      <line x1="60" y1="380" x2="150" y2="360"/><line x1="1120" y1="400" x2="1030" y2="380"/>
    </g>
    <g fill="#2c3a4a" opacity="0.7">
      <circle cx="120" cy="90" r="5"/><circle cx="230" cy="150" r="4"/><circle cx="180" cy="260" r="4"/>
      <circle cx="1000" cy="80" r="5"/><circle cx="900" cy="160" r="4"/><circle cx="960" cy="260" r="4"/>
      <circle cx="120" cy="640" r="4"/><circle cx="220" cy="600" r="4"/>
      <circle cx="960" cy="650" r="4"/><circle cx="880" cy="600" r="4"/>
      <circle cx="60" cy="380" r="4"/><circle cx="150" cy="360" r="4"/>
      <circle cx="1120" cy="400" r="4"/><circle cx="1030" cy="380" r="4"/>
    </g>

    <!-- extract edges: MainWindow -> 5 proposed groups -->
    <g stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4" opacity="0.85" fill="none">
      <line x1="560" y1="380" x2="430" y2="270"/>
      <line x1="560" y1="380" x2="700" y2="230"/>
      <line x1="560" y1="380" x2="760" y2="410"/>
      <line x1="560" y1="380" x2="660" y2="540"/>
      <line x1="560" y1="380" x2="420" y2="500"/>
    </g>
    <!-- new_coupling_edge: the worst pair, drawn solid red -->
    <path d="M430,270 Q565,190 700,230" fill="none" stroke="#f87171" stroke-width="2.2"/>

    <!-- MainWindow hub (real node, community color #4E79A7 per COMMUNITY_COLORS) -->
    <circle cx="560" cy="380" r="34" fill="url(#ss-glow-a)"/>
    <circle cx="560" cy="380" r="17" fill="#4E79A7" stroke="#4E79A7" stroke-width="1.5"/>
    <text x="560" y="384" text-anchor="middle" font-size="10.5" fill="#ffffff" font-weight="600">MainWindow</text>

    <!-- 5 proposed diamonds (dashed green ring, community-colored fill) -->
    <g transform="translate(430,270)"><path d="M0,-19 L19,0 L0,19 L-19,0 Z" fill="#F28E2B" stroke="#22c55e" stroke-width="2.6" stroke-dasharray="4 3"/></g>
    <text x="430" y="245" text-anchor="middle" font-size="10" fill="#e0e0e0" font-weight="600">Axis &amp; Range Controls</text>
    <text x="430" y="304" text-anchor="middle" font-size="9" fill="#7fd99f">95.8&#8594;87.0</text>

    <g transform="translate(700,230)"><path d="M0,-17 L17,0 L0,17 L-17,0 Z" fill="#E15759" stroke="#22c55e" stroke-width="2.4" stroke-dasharray="4 3"/></g>
    <text x="700" y="205" text-anchor="middle" font-size="10" fill="#e0e0e0" font-weight="600">Controller Core</text>

    <g transform="translate(760,410)"><path d="M0,-14 L14,0 L0,14 L-14,0 Z" fill="#76B7B2" stroke="#22c55e" stroke-width="2.2" stroke-dasharray="4 3"/></g>
    <text x="760" y="440" text-anchor="middle" font-size="10" fill="#e0e0e0" font-weight="600">UI Build</text>

    <g transform="translate(660,540)"><path d="M0,-12 L12,0 L0,12 L-12,0 Z" fill="#59A14F" stroke="#22c55e" stroke-width="2" stroke-dasharray="4 3"/></g>
    <text x="660" y="568" text-anchor="middle" font-size="10" fill="#e0e0e0" font-weight="600">File Open Actions</text>

    <g transform="translate(420,500)"><path d="M0,-11 L11,0 L0,11 L-11,0 Z" fill="#EDC948" stroke="#22c55e" stroke-width="2" stroke-dasharray="4 3"/></g>
    <text x="420" y="528" text-anchor="middle" font-size="10" fill="#e0e0e0" font-weight="600">Chart Style &amp; TDR</text>

    <circle cx="565" cy="188" r="30" fill="url(#ss-glow-b)"/>
    <text x="565" y="180" text-anchor="middle" font-size="9.5" fill="#f87171" font-style="italic" font-weight="600">shared: _chart_style, _x_range, _y_range...</text>
    <text x="565" y="196" text-anchor="middle" font-size="9" fill="#f87171" font-style="italic">overlap 0.608 (fields 0.541, calls 0.133)</text>
  </g>

  <!-- ===== sidebar (real page layout: #1a1a2e panel, 280px wide in the real page) ===== -->
  <g>
    <rect x="980" y="0" width="300" height="760" fill="#1a1a2e"/>
    <line x1="980" y1="0" x2="980" y2="760" stroke="#2a2a4e" stroke-width="1"/>

    <!-- search box -->
    <rect x="992" y="12" width="276" height="30" rx="6" fill="#0f0f1a" stroke="#3a3a5e"/>
    <text x="1004" y="32" font-size="12" fill="#666">Search nodes...</text>
    <line x1="980" y1="54" x2="1280" y2="54" stroke="#2a2a4e"/>

    <!-- info panel -->
    <text x="1006" y="76" font-size="11" fill="#aaa" letter-spacing="0.5">NODE INFO</text>
    <text x="1006" y="102" font-size="13" fill="#e0e0e0" font-weight="600">Main Window Axis &amp; Range Controls</text>
    <text x="1006" y="118" font-size="11" fill="#a8a29e">(proposed)</text>
    <text x="1006" y="140" font-size="12" fill="#ccc">Community: Main Window Axis &amp; Range Controls</text>
    <text x="1006" y="160" font-size="11" fill="#aaa">Decouple risk</text>
    <text x="1006" y="178" font-size="12" fill="#ccc">Recommendation: <tspan fill="#4ade80" font-weight="700">split</tspan></text>
    <text x="1006" y="196" font-size="12" fill="#ccc">risk_before &#8594; risk_after: 95.8 &#8594; 87.0 (net 8.8)</text>
    <text x="1006" y="220" font-size="11" fill="#94a3b8">Shares state with</text>
    <text x="1006" y="240" font-size="12" fill="#e0e0e0" font-weight="600">Main Window Controller Core — overlap 0.608</text>
    <text x="1006" y="256" font-size="10.5" fill="#f87171">writes: _x_range, _y_range</text>
    <text x="1006" y="272" font-size="10.5" fill="#ccc">fields: _chart_style, _crosshair, _hover_box, _logx...</text>
    <text x="1006" y="288" font-size="10.5" fill="#ccc">calls: _replot, statusBar</text>

    <line x1="980" y1="304" x2="1280" y2="304" stroke="#2a2a4e"/>

    <!-- controls -->
    <text x="1006" y="326" font-size="11" fill="#aaa" letter-spacing="0.5">COMMUNITIES</text>
    <rect x="1006" y="336" width="14" height="14" rx="3" fill="#4E79A7"/>
    <text x="1028" y="347" font-size="11.5" fill="#aaa">Select All</text>
    <rect x="1006" y="358" width="14" height="14" rx="3" fill="#22c55e"/>
    <text x="1028" y="369" font-size="11.5" fill="#e0e0e0">Preview decoupled view</text>
    <text x="1028" y="382" font-size="9.5" fill="#666">(hide old, show &#9670; proposed)</text>
    <rect x="1006" y="394" width="14" height="14" rx="3" fill="#22c55e"/>
    <text x="1028" y="405" font-size="11.5" fill="#e0e0e0">Show risk scores</text>

    <line x1="980" y1="424" x2="1280" y2="424" stroke="#2a2a4e"/>

    <!-- legend -->
    <g font-size="11.5" fill="#ccc">
      <circle cx="1013" cy="446" r="6" fill="#4E79A7"/><text x="1028" y="450">Main Window Controller Core</text>
      <circle cx="1013" cy="470" r="6" fill="#F28E2B"/><text x="1028" y="474">Axis &amp; Range Controls</text>
      <circle cx="1013" cy="494" r="6" fill="#E15759"/><text x="1028" y="498">Files Panel File Row Widget</text>
      <circle cx="1013" cy="518" r="6" fill="#76B7B2"/><text x="1028" y="522">Shared Plot Rendering Helpers</text>
      <circle cx="1013" cy="542" r="6" fill="#59A14F"/><text x="1028" y="546">Time Domain Settings Dialog</text>
      <circle cx="1013" cy="566" r="6" fill="#EDC948"/><text x="1028" y="570">Correlation Heatmap Dialog</text>
    </g>

    <line x1="980" y1="720" x2="1280" y2="720" stroke="#2a2a4e"/>
    <text x="1006" y="742" font-size="10.5" fill="#555">1243 nodes &#183; 2459 edges &#183; 85 communities</text>
  </g>

  <!-- window chrome, matching the demo-path.svg terminal-card convention -->
  <rect x="1" y="1" width="1278" height="758" rx="10" fill="none" stroke="#20342b" stroke-width="1.5"/>
</svg>
